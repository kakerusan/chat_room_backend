spring:
  application:
    name: chatBackend
  datasource:
    url: jdbc:mysql://localhost:3306/chatroom_lab?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: chatroom
    password: chatroom123
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: fun.hatsumi.chatbackend.user.entity,fun.hatsumi.chatbackend.chat.entity,fun.hatsumi.chatbackend.file.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

chatroom:
  jwt:
    issuer: chatroom-lab
    secret: ${CHATROOM_JWT_SECRET:}
    expire-hours: 12
  storage-root: ./data/storage
  log-root: ./data/logs/network-tests
  error-simulation-rate: 0.20
  error-simulation-seed:
  tcp-port: 9001
  udp-port: 9002
  blocking-benchmark-port: 9101
  nio-benchmark-port: 9102
  ws:
    auth-timeout-seconds: 5
    heartbeat-seconds: 20
    idle-timeout-seconds: 60
    max-text-message-size: 65536
