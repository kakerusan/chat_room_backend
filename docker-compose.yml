services:
  mysql:
    image: mysql:latest
    container_name: chatroom-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: chatroom_lab
      MYSQL_USER: chatroom
      MYSQL_PASSWORD: chatroom123
    ports:
      # 本机 3306 已被旧 MySQL 占用，容器映射到 3307
      - "3307:3306"
    volumes:
      - chatroom-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  chatroom-mysql-data:
